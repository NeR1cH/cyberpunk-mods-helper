name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.os }}, Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Тесты
        run: python -m unittest discover -s tests -q
      # На Windows compileall идёт после тестов, не параллельно (см. CONTRIBUTING.md).
      - name: Компиляция
        run: python -m compileall -q .
      - name: Пробелы в конце строк (весь репозиторий)
        # 4b825dc… — хеш пустого дерева git: сравнение с ним проверяет все файлы коммита.
        run: git diff --check 4b825dc642cb6eb9a060e54bf8d69288fbee4904 HEAD

  lint:
    name: ruff (только проверка)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Установка ruff
        run: python -m pip install ruff==0.16.9
      - name: ruff check
        run: ruff check --no-fix .
